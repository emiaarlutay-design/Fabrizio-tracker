name: Check Fabrizio Tweets

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run Script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py

      - name: Commit updated posted IDs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          touch posted_ids.txt
          git add posted_ids.txt
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Update posted IDs"
          # Pull latest before pushing to avoid conflicts from overlapping runs
          git pull --rebase --autostash origin main
          git push


             
