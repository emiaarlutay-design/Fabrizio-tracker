name: Check Fabrizio Tweets

on:
  schedule:
    - cron: '*/5 * * * *'   # backup schedule (cron-job.org is your main trigger)
  workflow_dispatch:         # allows manual runs + external API triggers

permissions:
  contents: write            # needed to commit state files

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          HEALTH_WEBHOOK: ${{ secrets.HEALTH_WEBHOOK }}
        run: python main.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          touch posted_ids.txt health_state.txt
          git add posted_ids.txt health_state.txt
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Update state files"
          git pull --rebase --autostash origin main
          git push
