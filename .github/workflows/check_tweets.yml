
name: Check Fabrizio Tweets

on:
  schedule:
    - cron: '*/5 * * * *'   # Request every 5 minutes
  workflow_dispatch:

permissions:
  contents: write            # Needed to commit the posted_ids file

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py

      - name: Commit updated posted IDs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add posted_ids.txt
          git diff --staged --quiet || git commit -m "Update posted IDs"
          git push
